{% import "_tokens.html" as tokens %}
<!doctype html>
<!--
  VisualIntent.STAT_CALLOUT -- a single number, given room to land. Data Drift style (T17 plan).
  `value` is a free-form STRING ("1 in 5", "3.2 billion") per core/slot_schemas.py -- not
  guaranteed numeric -- so this adapts counting-dynamic-scale's escalating-weight *mechanic*
  (scale grow, no digit count-up) rather than its literal onUpdate counter, and gives the value
  visual weight (data-in-motion.md: "numbers need a visual element that gives them presence")
  via a pair of accent rules bracketing it, instead of a percentage fill bar no arbitrary string
  can honestly support.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>stat_callout</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    {{ tokens.tokens_style() }}
    <style>
      #stage {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 200px;
        box-sizing: border-box;
      }
      #sc-bracket-top,
      #sc-bracket-bottom {
        width: 420px;
        height: 3px;
        background: linear-gradient(90deg, transparent, var(--accent-purple), var(--accent-cyan), transparent);
        transform-origin: center;
        display: block;
        will-change: transform;
      }
      #sc-bracket-top { margin-bottom: 44px; }
      #sc-bracket-bottom { margin-top: 44px; }
      #sc-value-row {
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 20px;
        opacity: 0;
        will-change: opacity, transform;
      }
      #sc-value {
        font-family: "JetBrains Mono", "Courier New", monospace;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        font-size: 176px;
        line-height: 1;
        transform-origin: center;
      }
      #sc-unit {
        font-family: "JetBrains Mono", "Courier New", monospace;
        font-weight: 400;
        font-size: 56px;
        color: var(--accent-cyan);
        opacity: 0;
        will-change: opacity, transform;
      }
      #sc-context {
        font-weight: 400;
        font-size: 38px;
        max-width: 78%;
        color: var(--fg);
        opacity: 0;
        will-change: opacity, transform;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="stat-callout"
      data-start="0"
      data-duration="{{ duration_sec }}"
      data-width="1920"
      data-height="1080"
    >
      {{ tokens.background_markup('sc', duration_sec) }}
      <div id="content" class="clip df-content-layer" data-start="0" data-duration="{{ duration_sec }}" data-track-index="1">
        <div id="stage">
          <span id="sc-bracket-top"></span>
          <div id="sc-value-row">
            <span id="sc-value">{{ slots.value }}</span>
            {% if slots.unit %}
            <span id="sc-unit">{{ slots.unit }}</span>
            {% endif %}
          </div>
          <span id="sc-bracket-bottom"></span>
          <p id="sc-context">{{ slots.context }}</p>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      {{ tokens.background_script('sc', duration_sec) }}

      // Brackets draw in from center outward, framing the value's arrival.
      tl.fromTo("#sc-bracket-top", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 0.15);
      tl.fromTo("#sc-bracket-bottom", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 0.25);

      // Value: escalating-weight scale grow (counting-dynamic-scale's mechanic, adapted for a
      // free-form string rather than a literal digit count-up).
      tl.fromTo("#sc-value-row", { opacity: 0 }, { opacity: 1, duration: 0.1 }, 0.35);
      tl.fromTo("#sc-value", { scale: 0.55 }, { scale: 1, duration: 1.1, ease: "power3.out" }, 0.35);

      {% if slots.unit %}
      // Unit slides in only after the value has landed -- its own beat, like a counter's suffix.
      tl.fromTo("#sc-unit", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 1.45);
      {% endif %}

      tl.fromTo("#sc-context", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.65);

      window.__timelines["stat-callout"] = tl;
    </script>
  </body>
</html>
