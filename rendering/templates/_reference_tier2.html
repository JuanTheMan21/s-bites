<!doctype html>
<!--
  VERIFIED REFERENCE — Tier 2 (animated) composition.

  This exact file rendered successfully to MP4 with hyperframes@0.8.8 during the T4 spike
  (90 frames, 1920x1080, H.264). It is here as a known-good starting point for the real Jinja
  templates in T10, not as a template itself — note the hardcoded content and duration.

  The contract, learned from the spike rather than the docs:

    Root element     data-composition-id, data-start, data-duration, data-width, data-height
    Timed elements   class="clip" + data-start, data-duration, data-track-index
    Animation        a PAUSED GSAP timeline registered on window.__timelines["<composition-id>"].
                     The renderer seeks it frame by frame, so anything driven by wall-clock time
                     (Date.now, setInterval, requestAnimationFrame loops) renders as a frozen frame.

  Two things to change when this becomes a real template:
    1. data-duration must come from MEASURED audio duration, injected as a Jinja variable.
       Never a constant, never an LLM estimate.
    2. GSAP is loaded from a CDN below. Vendor it locally before containerizing (T14) so rendering
       does not depend on network egress.

  Validate any derived template with:  npx hyperframes check
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 1920px; height: 1080px;
        overflow: hidden; background: #0b1020;
      }
      body { font-family: "Segoe UI", Inter, sans-serif; color: #e8ecf8; }
      .stage { padding: 120px 140px; }
      #title { font-size: 82px; font-weight: 700; letter-spacing: -1.5px; }
      #rule { height: 6px; width: 320px; background: #4f8cff; margin: 36px 0 56px; }
      .bullet { font-size: 44px; line-height: 1.6; opacity: 0; }
      .bullet span { color: #4f8cff; margin-right: 22px; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="3"
      data-width="1920"
      data-height="1080"
    >
      <div id="scene" class="clip stage" data-start="0" data-duration="3" data-track-index="0">
        <div id="title">SQL Injection</div>
        <div id="rule"></div>
        <div class="bullet" id="b0"><span>01</span>Untrusted input reaches the query</div>
        <div class="bullet" id="b1"><span>02</span>The parser cannot tell data from code</div>
        <div class="bullet" id="b2"><span>03</span>Parameterize, and the ambiguity disappears</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from("#title", { opacity: 0, y: -40, duration: 0.6 }, 0);
      tl.from("#rule", { scaleX: 0, transformOrigin: "left center", duration: 0.5 }, 0.4);
      tl.to("#b0", { opacity: 1, duration: 0.4 }, 0.9);
      tl.to("#b1", { opacity: 1, duration: 0.4 }, 1.4);
      tl.to("#b2", { opacity: 1, duration: 0.4 }, 1.9);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
