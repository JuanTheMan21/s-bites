[project]
name = "s-bites"
version = "0.1.0"
description = "Prompt-to-explainer-video pipeline: topic in, narrated MP4 out."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# `not live` by default keeps `pytest` offline, network-free and runnable on every edit -- the
# standing rule in CLAUDE.md. Live tests are opt-in: `pytest -m live`. They still skip rather
# than fail when a credential is missing, so a fresh clone runs green either way.
# `local_live` is the same contract (D56) for a different dependency: a real local runtime --
# Playwright's browser, the HyperFrames CLI -- actually installed, rather than Azure credentials.
addopts = "-q -m 'not live and not local_live'"
markers = [
    "live: calls a real Azure backend. Deselected by default; run with `pytest -m live`.",
    "local_live: needs a real local runtime (Playwright's browser, the HyperFrames CLI) installed. Deselected by default; run with `pytest -m local_live`.",
]

[tool.coverage.run]
source = ["core", "interfaces", "adapters"]
# Statement coverage says every line ran; branch coverage says every *decision* went both ways.
# T6's definition of done is the second one, so it is configured rather than left to a flag
# someone has to remember to pass.
branch = true
